  <title id="title">Qué incluye DevPanel</title>
  <desc id="desc">Task Pro: Tablero de tareas por proyecto, con prioridad y vencimientos. Proyectos de GitHub: Repos, commits, Actions y PR, con alertas cuando falla un build. Proyectos locales: Rama, cambios, fetch, pull y scripts de npm en una terminal. Herramientas: JSON, Base64, JWT, hash, UUID, regex y fechas. Todo local. Paleta de comandos: Ctrl + K para ir a cualquier vista, herramienta o proyecto. Login facial: Huella cifrada con DPAPI, nunca fotos. Código de 4 dígitos.</desc>
