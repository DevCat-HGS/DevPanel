name: Docker image (web)

# Publishes the web build as a container to GitHub Container Registry.
#   main      -> ghcr.io/devcat-hgs/devpanel-web:latest  (+ :stable)
#   developer -> ghcr.io/devcat-hgs/devpanel-web:dev
# GHCR packages are private by default, so the :dev image is only pullable by the owner
# unless the package visibility is changed in GitHub.
on:
  push:
    branches: [developer, main]
    paths:
      - "src/renderer/**"
      - "src/shared/**"
      - "scripts/**"
      - "package*.json"
      - "tsconfig.renderer.json"
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/devpanel-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=stable,enable=${{ github.ref_name == 'main' }}
            type=raw,value=dev,enable=${{ github.ref_name == 'developer' }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
