name: Build & Release

# Release channels
#   main      -> STABLE releases      (v0.1.<run>)        - what users install
#   developer -> DEVELOPMENT releases (v0.1.<run>-dev)    - prereleases with upcoming changes
#
# The "-dev" suffix is what keeps the channels apart: electron-updater only offers
# prereleases to apps that are themselves "-dev" builds, and GitHub's "latest" release
# (used by the installer) never points at a prerelease.
on:
  push:
    branches: [developer, main]
    paths-ignore:
      - "installer/**"
      - "tests/**"
      - "docs/**"
      - "docker/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "**/*.md"
      - ".github/workflows/installer.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/docker.yml"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are built from the commit history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve channel and version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          if [ "${{ github.ref_name }}" = "main" ]; then
            version="$base.${{ github.run_number }}"
            release_type="release"
          else
            version="$base.${{ github.run_number }}-dev"
            release_type="prerelease"
          fi
          echo "Publishing $version as $release_type"
          npm version "$version" --no-git-tag-version
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.build.publish[0].releaseType = '$release_type';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The face module ships as face_auth.exe (PyInstaller), so users do not need Python installed.
      - name: Package the face module
        shell: bash
        run: |
          pip install opencv-python numpy pyinstaller
          (cd python && python -m unittest -q test_liveness test_face_speed)
          PYTHONPATH=python python -m PyInstaller --onefile --name face_auth python/face_auth.py \
            --distpath python --workpath build/pyi --specpath build/pyi --paths python --noconfirm --log-level WARN
          python/face_auth.exe selftest --models-dir "$RUNNER_TEMP/face-models"

      - name: Package the project health module
        shell: bash
        run: |
          python -m PyInstaller --onefile --name project_health python/project_health.py             --distpath python --workpath build/pyi --specpath build/pyi --noconfirm --log-level WARN
          python/project_health.exe local . > /dev/null

      # signtool signs the Python executables here; electron-builder signs the app and installer through
      # the same script (build.win.sign). Without the CSC_LINK secret this only prints a warning.
      - name: Sign the Python executables
        shell: bash
        run: node scripts/sign.cjs python/face_auth.exe python/project_health.exe
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Build, package and publish release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # scripts/sign.cjs (signtool) signs the app and installer when these exist (empty = unsigned)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # Release notes from the commit messages since the previous release of this channel.
      - name: Write release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs --tag "v$version" > notes.md
          cat notes.md
          gh release edit "v$version" --notes-file notes.md

      # The plain NSIS "Setup" is only used by the auto-updater. People should install with the
      # custom installer, so it is attached to every release page next to it.
      - name: Attach the custom installer to this release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release download installer --pattern DevPanel-Installer.exe --dir . --clobber; then
            gh release upload "v$version" DevPanel-Installer.exe --clobber
          else
            echo "No installer release yet; skipping"
          fi
