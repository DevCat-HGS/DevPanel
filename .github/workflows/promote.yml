name: Promote developer to main

# Opens (or reuses) a pull request developer -> main. Merging it publishes the stable release.
# Needs "Allow GitHub Actions to create and approve pull requests" in Settings > Actions > General.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base main --head developer --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open."
            exit 0
          fi
          node scripts/release-notes.mjs --tag v0.0.0-dev > body.md || true
          gh pr create --base main --head developer \
            --title "Release: promote developer to main" \
            --body-file body.md
