version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    target-branch: developer
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors (Electron, TypeScript, electron-builder, @types/node...) change the toolchain: upgrade those by hand
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /installer
    schedule: { interval: monthly }
    target-branch: developer
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: developer
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
