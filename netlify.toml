# Web build of DevPanel (the same renderer UI that runs inside Electron).
#
# Branch model (see README):
#   main      -> production site   (set as the production branch in Netlify)
#   developer -> branch deploy     (developer--<site>.netlify.app, used as a live dev preview)
[build]
  command = "npm run build:web"
  publish = "dist/renderer"

[build.environment]
  NODE_VERSION = "22"
  # The web build doesn't need Electron's ~100MB binary
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"

[context.branch-deploy]
  command = "npm run build:web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
