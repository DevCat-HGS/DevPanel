# Web deployment of DevPanel (the same renderer UI that runs inside Electron).
[build]
  command = "npm run build:web"
  publish = "dist/renderer"

[build.environment]
  NODE_VERSION = "22"
  # The web build doesn't need Electron's ~100MB binary
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"

# Branch deploys: every push to `developer` gets its own URL (developer--<site>.netlify.app).
# Set the site's production branch in Netlify (Site configuration > Build & deploy > Branches).
[context.branch-deploy]
  command = "npm run build:web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
